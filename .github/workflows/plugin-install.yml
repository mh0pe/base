name: plugin-install

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-and-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Codex MCP registration and handshake
        run: |
          npm ci --prefix mcp --ignore-scripts --no-audit --no-fund
          node --test tests/codex-plugin.test.mjs
          node --test tests/satellite-state.test.mjs
          python -m unittest tests/test_install_mcp_deps.py
      - name: Install Codex CLI
        run: npm install -g @openai/codex
      - name: Install smoke test (Codex resolves the plugin MCP)
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: |
          set -euo pipefail
          codex plugin marketplace add . --json
          codex plugin add base@base --json
          codex mcp list --json | jq -e '
            any(.[];
              .name == "base-mcp"
              and .transport.args == ["mcp/codex-launch.js"]
              and (.transport.cwd | endswith("/."))
            )
          '
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin + marketplace manifest (strict)
        run: claude plugin validate . --strict
      - name: Install smoke test (claude can install the plugin)
        run: |
          set -euo pipefail
          claude plugin marketplace add ./
          claude plugin install base@base
          claude plugin list
          claude plugin list | grep -i base
